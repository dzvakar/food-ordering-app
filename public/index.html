<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodHub - Online Food Ordering</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top">
  <div class="container">
    <span class="navbar-brand fw-bold">🍽️ FoodHub</span>
    <div>
      <a class="btn btn-outline-light btn-sm me-2" href="#menu">Menu</a>
      <a class="btn btn-warning btn-sm" href="#orders">Orders</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <h1>Online Food Ordering Service</h1>
    <p class="lead">Manage dishes, menu details and customer orders.</p>
  </div>
</header>

<main class="container py-4">
  <div id="alertBox"></div>

  <section id="menu" class="mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2>Food Menu</h2>
        <p class="text-muted mb-0">Create, read, update and delete dishes.</p>
      </div>
      <button class="btn btn-primary" onclick="openAddFood()">+ Add Dish</button>
    </div>
    <div id="foodList" class="row g-4"></div>
  </section>

  <section id="orders">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2>Customer Orders</h2>
        <p class="text-muted mb-0">Manage order status and customer details.</p>
      </div>
    </div>
    <div id="ordersList"></div>
  </section>
</main>

<!-- Food Modal -->
<div class="modal fade" id="foodModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="foodForm">
      <div class="modal-header">
        <h5 class="modal-title" id="foodModalTitle">Add Dish</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="foodId">
        <div class="mb-3">
          <label class="form-label">Dish Name</label>
          <input id="foodName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Category</label>
          <input id="foodCategory" class="form-control" placeholder="Main Course" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Price (₹)</label>
          <input id="foodPrice" type="number" min="0" step="0.01" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="foodDescription" class="form-control"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Image URL (optional)</label>
          <input id="foodImage" class="form-control">
        </div>
        <div class="form-check">
          <input id="foodAvailable" class="form-check-input" type="checkbox" checked>
          <label class="form-check-label">Available</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Save Dish</button>
      </div>
    </form>
  </div>
</div>

<!-- Order Modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="orderForm">
      <div class="modal-header">
        <h5 class="modal-title">Place Order</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="selectedFoodName" class="alert alert-light"></div>
        <input type="hidden" id="selectedFoodId">
        <input type="hidden" id="selectedFoodPrice">
        <input type="hidden" id="selectedFoodNameValue">

        <div class="mb-3">
          <label class="form-label">Customer Name</label>
          <input id="customerName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input id="customerPhone" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Delivery Address</label>
          <textarea id="customerAddress" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Quantity</label>
          <input id="foodQuantity" type="number" min="1" value="1" class="form-control" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-success">Place Order</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
